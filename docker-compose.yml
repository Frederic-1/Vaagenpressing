services:
  db:
    image: postgres:17
    container_name: vaagenpressing-db
    environment:
      POSTGRES_DB: vaagenpressing
      POSTGRES_USER: vaagen
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vaagen_dev}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: